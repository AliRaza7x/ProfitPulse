<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ProfitPulse</title>
<meta name="description" content="Finds revenue leakage in retail and distribution data and explains it in plain language.">
<meta name="theme-color" content="#1E2B45">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%231E2B45'/%3E%3Cpath d='M4 17h5l3-7 5 13 3-6h4' fill='none' stroke='%23DCE5F2' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'/%3E%3Ccircle cx='26' cy='17' r='2.6' fill='%2322C55E'/%3E%3C/svg%3E">
<link rel="preload" href="/static/fonts/Outfit.ttf" as="font" type="font/ttf" crossorigin>
<link rel="stylesheet" href="/static/app.css">
<script>
  // Set the theme before first paint so there is no flash.
  var q = new URLSearchParams(location.search); if (q.has('still')) document.documentElement.classList.add('still');
  try { var t = q.get('theme') || localStorage.getItem('pp.theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'); document.documentElement.dataset.theme = t; } catch (e) {}
  document.documentElement.classList.add('js');
</script>
</head>
<body>
<div id="progress" aria-hidden="true"></div>
<a class="skip" href="#view">Skip to content</a>

<div class="shell">
  <aside class="rail" aria-label="Main">
    <a class="brand" href="#/overview" aria-label="ProfitPulse, executive overview">
      <span class="logo"><svg class="mark" viewBox="0 0 46 24" aria-hidden="true"><path d="M2 13h9l4-9 6 17 4-8h7"/><circle class="halo" cx="40" cy="13" r="3.4"/><circle cx="40" cy="13" r="3.4"/></svg></span>
      <span class="word"><span class="wm">Profit<span>Pulse</span></span><small>Revenue intelligence</small></span>
    </a>
    <nav id="nav" aria-label="Pages"></nav>
    <div class="export">
      <h2>Business report</h2>
      <p>Every page here, as a PDF to share or an Excel workbook to work in.</p>
      <a class="btn solid" id="dl-pdf" href="/api/reports/pdf" data-name="PDF"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg><span>Download PDF</span></a>
      <a class="btn ghost" id="dl-xlsx" href="/api/reports/xlsx" data-name="Excel"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg><span>Download Excel</span></a>
    </div>
    <div class="asof" id="asof"></div>
  </aside>

  <div class="stage">
    <header class="topbar" id="topbar">
      <a class="brand-sm" href="#/overview" aria-label="ProfitPulse">
        <span class="logo"><svg class="mark" viewBox="0 0 46 24" aria-hidden="true"><path d="M2 13h9l4-9 6 17 4-8h7"/><circle class="halo" cx="40" cy="13" r="3.4"/><circle cx="40" cy="13" r="3.4"/></svg></span>
      </a>
      <div class="crumb" id="crumb">Executive overview</div>
      <div class="top-actions">
        <span class="chip-live" id="live" title="Latest event in the data"><i></i><span id="live-text">Loading</span></span>
        <button class="icon-btn" id="theme" type="button" aria-label="Switch between light and dark theme" title="Switch theme">
          <svg class="i-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          <svg class="i-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4 8.5 8.5 0 1 0 20 14.5z"/></svg>
        </button>
        <div class="menu-wrap">
          <button class="top-report" id="report-btn" type="button" aria-haspopup="true" aria-expanded="false">Report</button>
          <div class="menu" id="report-menu" role="menu" hidden>
            <a role="menuitem" class="menu-item" id="dl-pdf-2" href="/api/reports/pdf" data-name="PDF">Download PDF</a>
            <a role="menuitem" class="menu-item" id="dl-xlsx-2" href="/api/reports/xlsx" data-name="Excel">Download Excel</a>
          </div>
        </div>
      </div>
    </header>
    <main id="view" tabindex="-1"></main>
    <footer class="foot" id="foot"></footer>
  </div>
</div>

<nav class="tabbar" id="tabbar" aria-label="Pages"></nav>
<div id="toasts" role="status" aria-live="polite"></div>
<div id="tip" role="tooltip"></div>
<script src="/static/app.js" defer></script>
</body>
</html>
