[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "profitpulse"
version = "0.1.0"
description = "Data engineering and business-intelligence platform that finds revenue leakage in retail event data."
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6",
    "psycopg2-binary>=2.9",
]

[project.optional-dependencies]
# Kafka client + Spark + data libs used by the pipeline image
pipeline = [
    "confluent-kafka>=2.5",
    "pyspark==4.0.4",
    "pandas>=2.2",
    "numpy>=1.26",
    "pyarrow>=15",
]
web = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "jinja2>=3.1",
    "weasyprint>=62",
    "openpyxl>=3.1",
    "pandas>=2.2",
    "numpy>=1.26",
]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "spark: needs a local SparkSession (slow)",
    "integration: needs running PostgreSQL / Kafka services",
    "e2e: full pipeline run against the 300k dataset",
]
addopts = "-ra"

[tool.ruff]
line-length = 110
target-version = "py311"
